<script>
/* ===== 翻訳テキスト =====
   ここの文言を書き換えれば各言語の表示が変わる。
   言語を増やしたい場合は、この I18N と 上の言語バーに1つ足すだけ。 */
var I18N = {
  ja: {
    title: "kanon",
    tagline: "ここに一言プロフィールが入ります",
    notice: "18歳未満の方の閲覧はご遠慮ください"
  },
  en: {
    title: "kanon",
    tagline: "A short profile goes here",
    notice: "Viewers under 18 are not permitted."
  },
  zh: {
    title: "kanon",
    tagline: "在此填写一句简介",
    notice: "未满18岁请勿浏览"
  },
  ko: {
    title: "kanon",
    tagline: "여기에 한 줄 소개가 들어갑니다",
    notice: "만 18세 미만은 열람할 수 없습니다"
  },
  es: {
    title: "kanon",
    tagline: "Aquí va una breve presentación",
    notice: "Prohibido para menores de 18 años."
  },
  it: {
    title: "kanon",
    tagline: "Qui va una breve presentazione",
    notice: "Vietato ai minori di 18 anni."
  },
  vi: {
    title: "kanon",
    tagline: "Phần giới thiệu ngắn ở đây",
    notice: "Không dành cho người dưới 18 tuổi."
  },
  tl: {
    title: "kanon",
    tagline: "Maikling profile dito",
    notice: "Bawal sa wala pang 18 taong gulang."
  }
};

function setLang(lang){
  var dict = I18N[lang];
  if(!dict){ return; }

  document.documentElement.setAttribute("lang", lang);
  document.title = dict.title;

  var i, key;
  var nodes = document.querySelectorAll("[data-i18n]");
  for(i = 0; i < nodes.length; i++){
    key = nodes[i].getAttribute("data-i18n");
    if(dict[key] !== undefined){ nodes[i].textContent = dict[key]; }
  }

  var btns = document.querySelectorAll(".lang-btn");
  for(i = 0; i < btns.length; i++){
    if(btns[i].getAttribute("data-lang") === lang){
      btns[i].classList.add("is-active");
    } else {
      btns[i].classList.remove("is-active");
    }
  }
}

(function(){
  var btns = document.querySelectorAll(".lang-btn");
  for(var i = 0; i < btns.length; i++){
    btns[i].addEventListener("click", function(){
      setLang(this.getAttribute("data-lang"));
    });
  }
  /* 海外向けなので、端末の言語に合わせて初期表示を切り替える（対応外は英語） */
  var nav = (navigator.language || "en").toLowerCase();
  var start = "en";
  if(nav.indexOf("ja") === 0){ start = "ja"; }
  else if(nav.indexOf("zh") === 0){ start = "zh"; }
  else if(nav.indexOf("ko") === 0){ start = "ko"; }
  else if(nav.indexOf("es") === 0){ start = "es"; }
  else if(nav.indexOf("it") === 0){ start = "it"; }
  else if(nav.indexOf("vi") === 0){ start = "vi"; }
  else if(nav.indexOf("tl") === 0 || nav.indexOf("fil") === 0){ start = "tl"; }
  setLang(start);
})();
</script>
